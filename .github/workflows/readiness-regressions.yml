name: MVP readiness regressions
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, fix/mvp-production-readiness]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://audit:audit@localhost:5432/eicc_audit
      JWT_SECRET: ci-only-placeholder-not-a-deployment-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:database
      - run: npm test -- --runInBand __tests__/api/course-access.test.ts __tests__/api/enrollment-isolation.test.ts __tests__/integration/plan-limits.integration.test.ts __tests__/integration/courses.integration.test.ts
      - run: npm run build
