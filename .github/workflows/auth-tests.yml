name: Auth Module Integration Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "app/api/auth/**"
      - "lib/auth.ts"
      - "lib/utils.ts"
      - "__tests__/integration/**"
      - "package.json"
      - "jest.config.js"
  pull_request:
    branches: [main, develop]
    paths:
      - "app/api/auth/**"
      - "lib/auth.ts"
      - "lib/utils.ts"
      - "__tests__/integration/**"
      - "package.json"
      - "jest.config.js"
  workflow_dispatch:
    inputs:
      test_type:
        description: "Tipo de test a ejecutar"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - auth
          - security
          - performance

jobs:
  test-auth:
    name: Auth Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]
        database: [postgres]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_auth_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup environment variables
        run: |
          echo "JWT_SECRET=test-secret-key-for-ci" >> $GITHUB_ENV
          echo "JWT_EXPIRES_IN=7d" >> $GITHUB_ENV
          echo "REFRESH_TOKEN_EXPIRES_IN=30d" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_auth_db" >> $GITHUB_ENV
          echo "NODE_ENV=test" >> $GITHUB_ENV

      - name: Wait for database
        run: |
          while ! pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for database..."
            sleep 2
          done

      - name: Setup database
        run: |
          npm run db:setup
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_auth_db

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Run auth tests
        if: github.event.inputs.test_type == 'auth' || github.event.inputs.test_type == 'all' || github.event.inputs.test_type == ''
        run: npm run test:auth
        env:
          JWT_SECRET: test-secret-key-for-ci
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_auth_db
          NODE_ENV: test

      - name: Run security tests
        if: github.event.inputs.test_type == 'security' || github.event.inputs.test_type == 'all' || github.event.inputs.test_type == ''
        run: npm run test:security
        env:
          JWT_SECRET: test-secret-key-for-ci
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_auth_db
          NODE_ENV: test

      - name: Run performance tests
        if: github.event.inputs.test_type == 'performance' || github.event.inputs.test_type == 'all' || github.event.inputs.test_type == ''
        run: npm run test:performance
        env:
          JWT_SECRET: test-secret-key-for-ci
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_auth_db
          NODE_ENV: test

      - name: Run all integration tests
        if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == ''
        run: npm run test:integration:coverage
        env:
          JWT_SECRET: test-secret-key-for-ci
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_auth_db
          NODE_ENV: test

      - name: Upload coverage reports
        if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == ''
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: auth-tests
          name: auth-integration-tests
          fail_ci_if_error: false

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const coveragePath = path.join(process.cwd(), 'coverage', 'lcov.info');
              if (fs.existsSync(coveragePath)) {
                const coverage = fs.readFileSync(coveragePath, 'utf8');
                const lines = coverage.split('\n');
                const summary = lines.find(line => line.startsWith('SF:'));
                
                if (summary) {
                  const comment = `## 🔐 Auth Module Tests Results
                  
                  ✅ **Tests Status**: All tests passed
                  
                  📊 **Coverage**: Integration tests completed
                  
                  🔍 **Test Details**:
                  - Login Flow: ✅
                  - Register Flow: ✅
                  - Token Validation: ✅
                  - Logout Flow: ✅
                  - Token Refresh: ✅
                  - Security Tests: ✅
                  - Performance Tests: ✅
                  
                  🛡️ **Security Validated**:
                  - SQL Injection Prevention: ✅
                  - XSS Prevention: ✅
                  - Input Validation: ✅
                  - Token Security: ✅
                  
                  ⚡ **Performance Validated**:
                  - High Load Handling: ✅
                  - Concurrent Requests: ✅
                  - Response Time: ✅
                  
                  ---
                  *Tests run on Node.js ${{ matrix.node-version }} with ${{ matrix.database }}*`;
                  
                  github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: comment
                  });
                }
              }
            } catch (error) {
              console.log('Could not create PR comment:', error.message);
            }

  test-matrix:
    name: Matrix Tests
    runs-on: ubuntu-latest
    needs: test-auth
    if: always()

    strategy:
      matrix:
        test-suite:
          [login, register, validation, logout, refresh, security, performance]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run specific test suite
        run: |
          npm test -- --testNamePattern="${{ matrix.test-suite }}" --verbose
        env:
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-suite }}
          path: |
            coverage/
            test-results/
          retention-days: 7

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test-auth, test-matrix]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test-auth.result }}" == "success" ] && [ "${{ needs.test-matrix.result }}" == "success" ]; then
            echo "✅ All auth tests passed"
            exit 0
          else
            echo "❌ Some auth tests failed"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🚨 Auth Tests Failed

            ❌ **Status**: Some authentication tests failed

            🔍 **Please check**:
            - Integration tests in \`__tests__/integration/\`
            - Auth endpoints in \`app/api/auth/\`
            - Auth utilities in \`lib/auth.ts\`

            📋 **Next steps**:
            1. Review the test logs
            2. Fix any failing tests
            3. Ensure all auth flows work correctly
            4. Re-run tests before merging

            ---
            *Tests run on ${{ github.sha }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
