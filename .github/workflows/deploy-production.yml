name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  # Job 1: Linting y Tests
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run unit tests
        run: npm run test:ci
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/coverage-final.json

  # Job 2: Build de Docker
  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/online-learning-platform:latest
            ${{ secrets.REGISTRY_URL }}/online-learning-platform:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.REGISTRY_URL }}/online-learning-platform:buildcache
          cache-to: type=registry,ref=${{ secrets.REGISTRY_URL }}/online-learning-platform:buildcache,mode=max

  # Job 3: Migraciones de Base de Datos
  migrate:
    name: Run Database Migrations
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  # Job 4: Deploy a Producción
  deploy:
    name: Deploy to Production
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tu-dominio.com
    
    steps:
      - name: Deploy to production
        run: |
          echo "Desplegando a producción..."
          # Comando específico según tu plataforma:
          # - Vercel: vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
          # - Railway: railway up --service=${{ secrets.RAILWAY_SERVICE }}
          # - Kubernetes: kubectl apply -f k8s/
          # - Docker Swarm: docker stack deploy -c docker-compose.yml app
      
      - name: Health check
        run: |
          echo "Verificando salud de la aplicación..."
          curl -f https://tu-dominio.com/api/health || exit 1
      
      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment completed with status: ${{ job.status }}"
          # Opcional: Enviar notificación a Slack, Discord, etc.
